[package]
name = "fastab_term"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
publish.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "fterm"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Tests that do not work on CI
desktop-tests = []
profiling_early_exit = []

[dependencies]
alacritty_terminal = { path = "../alacritty_terminal" }
anyhow.workspace = true
async-trait.workspace = true
bitflags.workspace = true
bstr.workspace = true
bytes.workspace = true
cfg-if.workspace = true
clap.workspace = true
dashmap.workspace = true
fastab_ipc.workspace = true
fastab_log.workspace = true
fastab_os_shim.workspace = true
fastab_proto.workspace = true
fastab_settings.workspace = true
fastab_util.workspace = true
filedescriptor = "0.8"
flume = "0.12.0"
fnv = "1.0.7"
memmem = "0.1.1"
mimalloc.workspace = true
num-traits = "0.2"
pin-project = "1.1.10"
portable-pty.workspace = true
shell-color.workspace = true
shlex.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-width.workspace = true
uuid.workspace = true
which.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(windows)'.dependencies]
lazy_static = "1.4"
shared_library = "0.1"
windows = { version = "0.58.0", features = ["Win32_System_Threading"] }
winapi = { version = "0.3", features = [
    "winuser",
    "winnls",
    "consoleapi",
    "handleapi",
    "fileapi",
    "namedpipeapi",
    "synchapi",
] }
winreg = "0.56.0"

[dev-dependencies]
assert_cmd.workspace = true
predicates = "3.0.1"
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
