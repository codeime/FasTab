[package]
name = "fastab_settings"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
publish.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Downstream integration tests (fastab_engine golden) need Settings::new() to see
# an installed override. `#[cfg(test)]` only applies to this crate's own tests.
test-support = []

[dependencies]
fd-lock = "4.0.4"
fastab_util.workspace = true
parking_lot.workspace = true
r2d2.workspace = true
r2d2_sqlite.workspace = true
rusqlite = { workspace = true, features = ["bundled", "serde_json"] }
scheduled-thread-pool = "0.2.7"
serde_json.workspace = true
serde.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
