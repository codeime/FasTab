[package]
name = "fastab_desktop"
authors = ["Fastab contributors"]
edition.workspace = true
homepage = "https://github.com/codeime/easy-complete"
publish.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "fastab"
path = "src/main.rs"

[lints]
workspace = true

[package.metadata.bundle]
name = "fastab"
icon = [
    "./icons/128x128.png",
    "./icons/16x16.png",
    "./icons/22x22.png",
    "./icons/24x24.png",
    "./icons/256x256.png",
    "./icons/32x32.png",
    "./icons/48x48.png",
    "./icons/512x512.png",
    "./icons/64x64.png",
]
identifier = "app.fastab"
resource = "./autocomplete-icons/*"

[features]
default = []
# console = ["tokio/tracing", "fastab_log/console"]
# Required for cargo-tauri CLI
custom-protocol = []
# Build with the system allocator instead of mimalloc, for footprint A/B runs.
system-allocator = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
cfg-if.workspace = true
clap.workspace = true
dashmap.workspace = true
fastab_engine = { path = "../fastab_engine" }
fastab_gpui = { path = "../fastab_gpui" }
fastab_desktop_api.workspace = true
fastab_telemetry.workspace = true
fastab_install.workspace = true
fastab_integrations = { workspace = true, features = ["dispatch"] }
fastab_ipc.workspace = true
fastab_log.workspace = true
fastab_os_shim.workspace = true
fastab_proto.workspace = true
fastab_remote_ipc.workspace = true
fastab_settings.workspace = true
fastab_util.workspace = true
flume.workspace = true
fnv = "1.0.7"
futures.workspace = true
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
image = { version = "0.25.6", default-features = false, features = ["png"] }
mimalloc.workspace = true
muda = { version = "0.19.3", default-features = false }
notify = "8.0.0"
parking_lot = { workspace = true, features = ["serde"] }
paste = "1.0.11"
rfd = "0.17.2"
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tao = { version = "0.36.0", features = ["serde"] }
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tray-icon = { version = "0.24.2", default-features = false }
unicode-width.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
fastab_settings = { workspace = true, features = ["test-support"] }
gpui = { version = "0.2.2", features = ["test-support"] }
tempfile.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58.0"
features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
]

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
sysinfo.workspace = true


[target.'cfg(target_os="macos")'.dependencies]
accessibility-sys = { path = "../macos-utils/accessibility-master/accessibility-sys", version = "0.1.3" }
cocoa.workspace = true
dispatch = "0.2.0"
core-foundation.workspace = true
core-graphics.workspace = true
libc.workspace = true
macos-utils = { path = "../macos-utils" }
objc.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
    "NSApplication",
    "NSButton",
    "NSColor",
    "NSColorSpace",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
] }
objc2-foundation = { workspace = true, features = ["NSUserDefaults"] }
