[package]
name = "fastab_cli"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
publish.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "ftab"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
wayland = ["arboard/wayland-data-control"]
# `ftab engine complete`, the headless completion engine. A development tool
# (scripts/replay-sessions.sh); off in shipped builds, where it linked the
# whole engine (~1.1 MB of code) into the CLI.
engine-cli = []

[dependencies]
anstream.workspace = true
appkit-nsworkspace-bindings.workspace = true
arboard = { version = "3.5.0", default-features = false }
async-trait.workspace = true
bytes.workspace = true
cfg-if.workspace = true
clap.workspace = true
clap_complete = "4.5.46"
clap_complete_fig = "4.4.0"
color-eyre = "0.6.5"
color-print = "0.3.5"
crossterm.workspace = true
ctrlc = "3.4.6"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
fastab_engine = { path = "../fastab_engine" }
eyre.workspace = true
fastab_diagnostic.workspace = true
fastab_install.workspace = true
fastab_integrations.workspace = true
fastab_ipc.workspace = true
fastab_log.workspace = true
fastab_os_shim.workspace = true
fastab_proto.workspace = true
fastab_remote_ipc.workspace = true
fastab_settings.workspace = true
fastab_telemetry.workspace = true
fastab_util.workspace = true
futures.workspace = true
glob.workspace = true
globset.workspace = true
indoc.workspace = true
mimalloc.workspace = true
owo-colors = "4.2.0"
rand.workspace = true
regex.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
spinners.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
time.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
walkdir.workspace = true
which.workspace = true
whoami.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
macos-utils = { path = "../macos-utils" }
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSRunningApplication"] }
objc2-foundation.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58.0", features = ["Win32_System_Threading"] }
winapi = { version = "0.3", features = ["consoleapi"] }

[dev-dependencies]
assert_cmd.workspace = true
criterion = "0.8.2"
insta.workspace = true
paste = "1.0.11"
predicates = "3.0"
