name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml

      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      # --check is the same freshness gate as a full sync + git diff, without
      # rewriting bundle/specs or preflight-compiling gitignored specs-ir.
      # A later step compiles IR once for audit / spec-pair / engine tests.
      - name: Verify bundled specs source
        run: |
          git ls-files --error-unmatch bundle/specs/.source-manifest.json >/dev/null
          node scripts/sync-bundled-specs.mjs --check

      - name: Test spec IR compiler
        run: |
          node --check scripts/build-spec-inputs.mjs
          node --check scripts/publish-app-bundle.mjs
          bash -n scripts/build-app.sh
          bash -n scripts/assert-no-runtime-js.sh
          node --test --test-concurrency=1 scripts/compile-spec-ir.test.mjs scripts/audit-spec-hooks.test.mjs scripts/compiler-hook-chain.test.mjs scripts/spec-pair.test.mjs scripts/sync-bundled-specs.test.mjs scripts/typed-hook-ir.test.mjs scripts/build-spec-inputs.test.mjs scripts/publish-app-bundle.test.mjs

      - name: Compile and audit bundled spec IR
        run: |
          node scripts/compile-spec-ir.mjs
          node scripts/audit-spec-hooks.mjs
          node scripts/spec-pair.mjs
          node scripts/capture-typed-trigger-reference.mjs --check
          node scripts/capture-typed-trigger-reference.mjs --get-query-term --check
          node scripts/capture-typed-reference.mjs --field getQueryTerm --check
          node scripts/capture-typed-reference.mjs --field postProcess --check
          node scripts/capture-typed-reference.mjs --field script --check
          node scripts/capture-typed-reference.mjs --field filterTemplateSuggestions --check
          ./scripts/assert-no-runtime-js.sh

      - name: Verify native hook inventory
        run: node scripts/classify-native-hooks.mjs --check

      - name: Assert path-switch gate
        run: |
          node -e '
            const expected = process.env.EC_GATE_PATH_SWITCH_EXPECTED;
            const inventory = require("./crates/fastab_engine/testdata/native-hooks/inventory.json");
            const allowed = inventory.gate && inventory.gate.pathSwitchAllowed === true;
            if (expected === "false") {
              if (allowed) {
                console.error("EC_GATE_PATH_SWITCH_EXPECTED=false but gate.pathSwitchAllowed is true");
                process.exit(1);
              }
              process.exit(0);
            }
            if (!allowed) {
              console.error("T3.4 requires inventory.json gate.pathSwitchAllowed === true");
              process.exit(1);
            }
          '

      - name: Test hook output baselines
        run: node --test --test-concurrency=1 scripts/hook-baseline-contract.test.mjs scripts/capture-hook-baseline.test.mjs scripts/record-cli-output.test.mjs

      - name: Verify CLI output samples
        run: node scripts/record-cli-output.mjs --check

      - name: Verify hook output baselines
        run: node scripts/capture-hook-baseline.mjs --check

      - name: Test native inventory and test-only source reference
        run: node --test --test-concurrency=1 scripts/native-hook-adapters.test.mjs scripts/classify-native-hooks.test.mjs scripts/reference-audit-worker.test.mjs scripts/capture-hook-reference.test.mjs scripts/capture-hook-reference-batch.test.mjs scripts/capture-typed-trigger-reference.test.mjs

      - name: Build packages
        run: pnpm build

      - name: Lint packages
        run: pnpm lint

      - name: Test packages
        run: pnpm test:ci

      - name: Install website dependencies
        env:
          HUSKY: 0
        run: pnpm -C website install --frozen-lockfile

      - name: Build website
        run: pnpm -C website build

  rust:
    name: Rust
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Record build identity
        run: |
          echo "AMAZON_Q_BUILD_HASH=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "AMAZON_Q_BUILD_DATETIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "AMAZON_Q_BUILD_TARGET_TRIPLE=aarch64-apple-darwin" >> "$GITHUB_ENV"
          echo "FASTAB_BUILD_RUN_ID=$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install fish protobuf shellcheck

      - name: Set up Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci

      - name: Check formatting
        run: cargo fmt --check

      - name: Test atomic app bundle swap helper
        run: |
          swap_root="$(mktemp -d "$RUNNER_TEMP/easy-complete-atomic-swap.XXXXXX")"
          mkdir "$swap_root/left" "$swap_root/right"
          touch "$swap_root/left/from-left" "$swap_root/right/from-right"
          /usr/bin/xcrun clang -Os -Wall -Wextra -Werror -mmacosx-version-min=12.0 scripts/atomic-swap-darwin.c -o "$swap_root/atomic-swap-darwin"
          "$swap_root/atomic-swap-darwin" swap "$swap_root/left" "$swap_root/right"
          test -f "$swap_root/left/from-right"
          test -f "$swap_root/right/from-left"
          test ! -e "$swap_root/left/from-left"
          test ! -e "$swap_root/right/from-right"
          mkdir "$swap_root/exclusive-source"
          touch "$swap_root/exclusive-source/published"
          "$swap_root/atomic-swap-darwin" exclusive "$swap_root/exclusive-source" "$swap_root/exclusive-final"
          test -f "$swap_root/exclusive-final/published"
          mkdir "$swap_root/exclusive-collision"
          mkdir "$swap_root/exclusive-existing"
          if "$swap_root/atomic-swap-darwin" exclusive "$swap_root/exclusive-collision" "$swap_root/exclusive-existing"; then
            echo "RENAME_EXCL unexpectedly replaced an existing directory" >&2
            exit 1
          fi
          test -d "$swap_root/exclusive-collision"
          test -d "$swap_root/exclusive-existing"

      - name: Clippy
        run: cargo clippy --locked --workspace --exclude fastab_desktop-fuzz --exclude fastab_overlay_spike --exclude fastab_term2 --color always -- -D warnings

      # The engine's typed-hook provenance tests verify the checked-in
      # reference baselines against the compiled bundle/specs-ir pair, which is
      # gitignored. Compile it here exactly as build-app.sh does.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install JS dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      - name: Compile bundled spec IR for engine tests
        run: node scripts/compile-spec-ir.mjs

      - name: Enforce zero runtime JavaScript
        run: ./scripts/assert-no-runtime-js.sh

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          resource_log="$(mktemp)"
          trap 'rm -f "$resource_log"' EXIT
          cargo test --workspace --locked --no-fail-fast --exclude fastab_desktop-fuzz --exclude fastab_overlay_spike --exclude fastab_term2 2>&1 | tee "$resource_log"
          # GPUI is not a workspace member. Its private ownership fixtures run
          # through fastab_gpui's test-support dependency, without needing a GPU.
          # Fail if feature/cfg drift silently removes a CPU-only regression.
          test "$(grep -Ec '^test resource_ownership_tests::.* \.\.\. ok$' "$resource_log")" -eq 11
          # Metal availability is not guaranteed on hosted runners. Compile and
          # collect the hardware fixtures; execute them separately on a GPU host.
          test "$(grep -Ec '^test resource_ownership_tests::metal_surface_cache_.* \.\.\. ignored' "$resource_log")" -eq 2

      - name: Replay completion resource lifecycle in one process
        run: cargo run --locked -p fastab_engine --example resource-replay -- --self-check

      # Thin LTO + codegen-units=1 is minutes on every PR and duplicates the
      # tag pipeline in release.yml. Keep the smoke on main so profile-specific
      # breakage (panic = "abort", LTO, strip) still lands before a tag.
      - name: Build release binaries (dist profile)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo build --locked --profile dist -p fastab_desktop -p fastab_term -p fastab_cli -p fastab_input_method
