name: Regenerate hook fixtures

# A spec change that moves a generator's script argv needs new CLI output
# samples and hook output baselines. Producing them means compiling spec IR and
# running the recorded commands, which happens here rather than on a developer
# machine. Push a `regen/**` branch: this job commits the regenerated fixtures
# back to that branch for review, and the branch is merged once they look right.
# A push made with GITHUB_TOKEN does not start another workflow run. There is
# deliberately no workflow_dispatch: run on main, it would commit there unreviewed.

on:
  push:
    branches: ["regen/**"]

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Every remote branch and tag, so git samples list more than one ref.
          fetch-depth: 0
          # pnpm install scripts and the recorded commands run before the
          # commit step. Keep the write token out of .git/config until then.
          persist-credentials: false

      # Record git samples on a named branch, not a detached HEAD, so branch
      # hooks see the current-branch row they are written to mark.
      - name: Check out the branch by name
        run: git checkout -B "$GITHUB_REF_NAME"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      - name: Compile spec IR
        run: node scripts/compile-spec-ir.mjs

      # --missing runs only argv that have no sample yet and prunes samples no
      # argv names, so unrelated samples keep their recorded output.
      - name: Record new CLI output samples
        run: node scripts/record-cli-output.mjs --missing

      - name: Update hook output baselines
        run: node scripts/capture-hook-baseline.mjs --update

      - name: Update native hook inventory
        run: node scripts/classify-native-hooks.mjs --update

      - name: Verify regenerated fixtures
        run: |
          node scripts/record-cli-output.mjs --check
          node scripts/capture-hook-baseline.mjs --check
          node scripts/classify-native-hooks.mjs --check

      - name: Commit regenerated fixtures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add crates/fastab_engine/testdata/native-hooks
          if git diff --cached --quiet; then
            echo "No fixture changes"
            exit 0
          fi
          git diff --cached --stat
          source="$(git rev-parse --short HEAD)"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "test: regenerate hook fixtures for ${source}" \
            -m "Generated by the Regenerate hook fixtures workflow (run ${GITHUB_RUN_ID})."
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"
