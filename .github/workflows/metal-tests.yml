name: Native CoreVideo cache regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metal:
    # Hosted macOS runners may lack an accessible Metal device. This explicit
    # entry point requires a registered Mac with a GUI session and real GPU.
    runs-on: [self-hosted, macOS, ARM64, fastab-metal]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify host and pinned toolchain
        run: |
          test "$(uname -m)" = arm64
          system_profiler SPDisplaysDataType
          rustup show
      - name: Run native CoreVideo cache regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fastab_gpui --lib resource_ownership_tests::metal_surface_cache_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee metal-tests.log
          grep -Eq '^test resource_ownership_tests::metal_surface_cache_borrows_the_device \.\.\. ok$' metal-tests.log
          grep -Eq '^test resource_ownership_tests::metal_surface_cache_is_lazy_and_releases_its_owner \.\.\. ok$' metal-tests.log
          grep -Eq '^test result: ok\. 2 passed; 0 failed;' metal-tests.log
      - name: Preserve native test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-metal-regression
          path: metal-tests.log
          if-no-files-found: warn
