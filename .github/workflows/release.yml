name: Build ARM DMG

on:
  push:
    tags:
      - "v*"
      - "*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SPARKLE_VERSION: 2.9.3

jobs:
  build-arm-dmg:
    name: Build ARM DMG
    # The app icon is the committed icon.icns. This runner stays on macOS 26
    # so the rest of the app build matches the current Xcode.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Record start time
        id: start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tags must be v<major>.<minor>.<patch> or v<version>-(alpha|beta|rc)[.<suffix>]." >&2
            echo "The website and README download links use the v-prefixed tag." >&2
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(awk -F '"' '/^\[workspace\.package\]$/{in_workspace=1;next} /^\[/{in_workspace=0} in_workspace && /^version = "/{print $2;exit}' Cargo.toml)"
          website_version="$(sed -nE 's/^export const APP_VERSION = "([^"]+)";$/\1/p' website/src/download.ts)"
          if [ -z "$cargo_version" ] || [ -z "$website_version" ]; then
            echo "Could not read the workspace or website app version." >&2
            exit 1
          fi
          if [ "$tag_version" != "$cargo_version" ] || [ "$tag_version" != "$website_version" ]; then
            echo "Release tag $GITHUB_REF_NAME must match Cargo ($cargo_version) and website ($website_version)." >&2
            exit 1
          fi

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers

      - name: Detect release capabilities
        if: startsWith(github.ref, 'refs/tags/')
        id: caps
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail

          signing_missing=()
          [ -z "$APPLE_CERTIFICATE_P12_BASE64" ] && signing_missing+=("APPLE_CERTIFICATE_P12_BASE64")
          [ -z "$APPLE_CERTIFICATE_PASSWORD" ] && signing_missing+=("APPLE_CERTIFICATE_PASSWORD")
          [ -z "$APPLE_SIGNING_IDENTITY" ] && signing_missing+=("APPLE_SIGNING_IDENTITY")
          if [ "${#signing_missing[@]}" -eq 0 ]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing secrets are present."
          else
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "No Developer ID secrets; publishing an ad-hoc signed DMG. Missing: ${signing_missing[*]}"
          fi

          has_notary_api=0
          if { [ -n "$APPLE_NOTARY_KEY_BASE64" ] || [ -n "$APPLE_NOTARY_KEY" ]; } \
            && [ -n "$APPLE_NOTARY_KEY_ID" ] && [ -n "$APPLE_NOTARY_ISSUER_ID" ]; then
            has_notary_api=1
          fi
          has_notary_apple_id=0
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            has_notary_apple_id=1
          fi
          if [ "${#signing_missing[@]}" -eq 0 ] && { [ "$has_notary_api" -eq 1 ] || [ "$has_notary_apple_id" -eq 1 ]; }; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
            echo "Notarization secrets are present."
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            if [ "${#signing_missing[@]}" -eq 0 ]; then
              echo "Developer ID is present, but notarization secrets are not; skipping notarization."
            else
              echo "Skipping notarization because Developer ID signing is unavailable."
            fi
          fi

          if [ -n "$SPARKLE_PRIVATE_ED_KEY" ] && [ -n "$SPARKLE_PUBLIC_ED_KEY" ]; then
            echo "sparkle=true" >> "$GITHUB_OUTPUT"
            echo "Sparkle signing key pair is present."
          else
            echo "sparkle=false" >> "$GITHUB_OUTPUT"
            echo "Sparkle signing key pair is incomplete; skipping appcast and delta generation."
          fi

      - name: Cache Homebrew packages
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.arch }}-bash-create-dmg-fish-jq-protobuf-shellcheck-zsh-v1

      - name: Install build dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install bash create-dmg fish jq protobuf shellcheck zsh

      - name: Cache Sparkle framework
        uses: actions/cache@v6
        with:
          path: build/sparkle
          key: sparkle-${{ env.SPARKLE_VERSION }}

      - name: Set up Rust
        run: |
          rustup show
          rustup target add aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: arm64-dmg

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install JS dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      - name: Import Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/') && steps.caps.outputs.signing == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE_P12_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(uuidgen)}"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/easy-complete-signing.keychain-db"

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          mapfile -t EXISTING_KEYCHAINS < <(security list-keychain -d user | sed 's/[ "]//g')
          security list-keychain -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build app bundle
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_CAPABLE: ${{ steps.caps.outputs.sparkle }}
          RELEASE_TAG: ${{ github.ref_name }}
          SPARKLE_APPCAST_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
          POSTHOG_ENDPOINT: ${{ secrets.POSTHOG_ENDPOINT }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          if [[ "$SPARKLE_CAPABLE" == "true" && "$RELEASE_TAG" != *-* ]]; then
            export SPARKLE_AUTOMATIC_CHECKS=true
          else
            export SPARKLE_AUTOMATIC_CHECKS=false
          fi
          ./scripts/build-app.sh
          ./scripts/assert-no-runtime-js.sh "build/Fastab.app/Contents/Resources"

      - name: Verify built app version and display name
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          plist="build/Fastab.app/Contents/Info.plist"
          tag_version="${GITHUB_REF_NAME#v}"
          short_version="$(plutil -extract CFBundleShortVersionString raw -o - "$plist")"
          bundle_version="$(plutil -extract CFBundleVersion raw -o - "$plist")"
          if [ "$short_version" != "$tag_version" ] || [ "$bundle_version" != "$tag_version" ]; then
            echo "Built app version ($short_version, $bundle_version) does not match release tag $GITHUB_REF_NAME." >&2
            exit 1
          fi
          test "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = "app.fastab"
          test "$(plutil -extract CFBundleExecutable raw -o - "$plist")" = "fastab"
          test "$(plutil -extract CFBundleName raw -o - "$plist")" = "Fastab"
          test "$(plutil -extract CFBundleDisplayName raw -o - "$plist")" = "Fastab"
          test "$(plutil -extract CFBundleDevelopmentRegion raw -o - "$plist")" = "en"
          names="build/Fastab.app/Contents/Resources/en.lproj/InfoPlist.strings"
          test "$(plutil -extract CFBundleName raw -o - "$names")" = "FasTab"
          test "$(plutil -extract CFBundleDisplayName raw -o - "$names")" = "FasTab"

      - name: Collect dSYMs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # Symbols are worth having, not worth blocking a release for: a
          # missing dSYM is reported and the run keeps none.
          # Signing does not change the UUIDs these are matched by.
          if ! ./scripts/collect-dsyms.sh dist/dSYMs \
            build/Fastab.app/Contents/MacOS/fastab \
            build/Fastab.app/Contents/MacOS/ftab \
            build/Fastab.app/Contents/MacOS/fterm \
            build/Fastab.app/Contents/Helpers/FastabInputMethod.app/Contents/MacOS/fastab_input_method; then
            rm -rf dist/dSYMs
            echo "::warning::No dSYMs for this release; see the error above."
          fi

      # Debug symbols are for us, not for users: they stay a workflow artifact
      # of this run and never become a release asset. Download them from the
      # run's page to symbolicate a crash report or a malloc stack log.
      - name: Upload dSYMs
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: Fastab-${{ github.ref_name }}-arm64-dSYMs
          path: dist/dSYMs/
          retention-days: 90
          if-no-files-found: warn

      - name: Sign app bundle
        if: startsWith(github.ref, 'refs/tags/') && steps.caps.outputs.signing == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./scripts/sign-macos-app.sh

      - name: Package ARM DMG
        if: startsWith(github.ref, 'refs/tags/')
        run: ./scripts/make-dmg.sh dist/Fastab-arm64.dmg

      - name: Verify bundled license payload
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          MOUNT_DIR="$(mktemp -d)"
          hdiutil attach dist/Fastab-arm64.dmg -readonly -nobrowse -mountpoint "$MOUNT_DIR" >/dev/null
          trap 'hdiutil detach "$MOUNT_DIR" >/dev/null || true' EXIT
          ./scripts/verify-license-bundle.sh "$MOUNT_DIR/Fastab.app"
          names="$MOUNT_DIR/Fastab.app/Contents/Resources/en.lproj/InfoPlist.strings"
          test "$(plutil -extract CFBundleDisplayName raw -o - "$names")" = "FasTab"
          test ! -e "$MOUNT_DIR/Licenses"

      - name: Notarize DMG
        if: startsWith(github.ref, 'refs/tags/') && steps.caps.outputs.notarize == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/notarize-dmg.sh dist/Fastab-arm64.dmg

      - name: Copy versioned DMG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          APP_VERSION="${GITHUB_REF_NAME#v}"
          cp dist/Fastab-arm64.dmg "dist/Fastab-${APP_VERSION}-arm64.dmg"

      - name: Prepare Sparkle archives
        if: startsWith(github.ref, 'refs/tags/') && steps.caps.outputs.sparkle == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ github.ref_name }}
          HISTORY_LIMIT: 8
          APPCAST_DIR: dist/sparkle
        run: |
          set -euo pipefail

          APP_VERSION="${CURRENT_TAG#v}"
          VERSIONED_DMG="dist/Fastab-${APP_VERSION}-arm64.dmg"
          VERSIONED_NAME="$(basename "$VERSIONED_DMG")"

          rm -rf "$APPCAST_DIR"
          mkdir -p "$APPCAST_DIR"

          cp "$VERSIONED_DMG" "$APPCAST_DIR/$VERSIONED_NAME"

          RELEASES_JSON="$RUNNER_TEMP/releases.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" > "$RELEASES_JSON"
          mapfile -t PREVIOUS_TAGS < <(
            jq -r --arg current "$CURRENT_TAG" --argjson limit "$HISTORY_LIMIT" \
              '[.[] | select(.draft == false) | select(.prerelease == false) | select(.tag_name != $current)] | .[:$limit][] | .tag_name' \
              "$RELEASES_JSON"
          )

          if [ "${#PREVIOUS_TAGS[@]}" -eq 0 ]; then
            echo "No previous releases found; generating a full-update-only appcast."
            exit 0
          fi

          PREVIOUS_APPCAST_DIR="$RUNNER_TEMP/previous-appcast"
          mkdir -p "$PREVIOUS_APPCAST_DIR"
          if gh release download "${PREVIOUS_TAGS[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "appcast.xml" \
            --dir "$PREVIOUS_APPCAST_DIR" \
            --clobber; then
            mv "$PREVIOUS_APPCAST_DIR/appcast.xml" "$APPCAST_DIR/appcast.xml"
          else
            echo "Previous appcast.xml not found; generating a full-update-only appcast."
            exit 0
          fi

          for tag in "${PREVIOUS_TAGS[@]}"; do
            version="${tag#v}"
            dest="$APPCAST_DIR/Fastab-${version}-arm64.dmg"
            tmp="$RUNNER_TEMP/sparkle-${tag//[^A-Za-z0-9._-]/_}"
            rm -rf "$tmp"
            mkdir -p "$tmp"

            if gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "Fastab-${version}-arm64.dmg" \
              --dir "$tmp" \
              --clobber; then
              mv "$tmp/Fastab-${version}-arm64.dmg" "$dest"
            elif gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "Fastab-arm64.dmg" \
              --dir "$tmp" \
              --clobber; then
              mv "$tmp/Fastab-arm64.dmg" "$dest"
            else
              echo "Skipping $tag: no compatible ARM64 DMG asset found."
            fi
          done

      - name: Extract release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          NOTES=$(awk "/^## ${VERSION}$/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md | sed '/^[[:space:]]*$/d')
          if [ -z "$NOTES" ]; then
            NOTES="See the [GitHub release](https://github.com/${{ github.repository }}/releases/tag/${VERSION}) for details."
          fi
          mkdir -p dist
          printf '%s\n' "$NOTES" > dist/changelog-notes.md
          echo "SPARKLE_RELEASE_NOTES<<EOF" >> "$GITHUB_ENV"
          echo "$NOTES" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/') && steps.caps.outputs.sparkle == 'true'
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_DOWNLOAD_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
          SPARKLE_BUNDLE_VERSION: ${{ github.ref_name }}
        run: |
          APP_VERSION="${SPARKLE_BUNDLE_VERSION#v}"
          SPARKLE_BUNDLE_VERSION="$APP_VERSION" \
          ./scripts/generate-sparkle-appcast.sh "dist/Fastab-${APP_VERSION}-arm64.dmg"

      - name: Verify release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_ENABLED: ${{ steps.caps.outputs.sparkle }}
        run: |
          set -euo pipefail
          APP_VERSION="${GITHUB_REF_NAME#v}"
          test -f dist/Fastab-arm64.dmg
          test -f "dist/Fastab-${APP_VERSION}-arm64.dmg"

          if [ "$SPARKLE_ENABLED" != "true" ]; then
            echo "Sparkle secrets are absent; skipping appcast verification."
            exit 0
          fi

          test -f dist/sparkle/appcast.xml
          test "$(grep -c '<item>' dist/sparkle/appcast.xml)" -eq 1
          grep -Fq "<sparkle:version>${APP_VERSION}</sparkle:version>" dist/sparkle/appcast.xml
          python3 - <<'PY'
          import pathlib
          import re

          appcast_dir = pathlib.Path("dist/sparkle")
          appcast = (appcast_dir / "appcast.xml").read_text()
          referenced = {
              pathlib.PurePosixPath(url).name
              for url in re.findall(r'url="([^"]+\.delta)"', appcast)
          }
          available = {path.name for path in appcast_dir.glob("*.delta")}
          if not referenced:
              if available:
                  raise SystemExit(
                      f"delta files are not referenced by appcast: {', '.join(sorted(available))}"
                  )
              print("No delta enclosures; allowing a full-update-only appcast.")
          else:
              missing = sorted(referenced - available)
              if missing:
                  raise SystemExit(f"appcast references missing delta files: {', '.join(missing)}")
              unexpected = sorted(available - referenced)
              if unexpected:
                  raise SystemExit(f"delta files are not referenced by appcast: {', '.join(unexpected)}")
          PY
          find dist/sparkle -maxdepth 1 -name '*.delta' -print

      - name: Classify release channel
        if: startsWith(github.ref, 'refs/tags/')
        id: release_channel
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)(\.[0-9A-Za-z-]+)*$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose GitHub Release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SIGNING: ${{ steps.caps.outputs.signing }}
          NOTARIZE: ${{ steps.caps.outputs.notarize }}
          SPARKLE: ${{ steps.caps.outputs.sparkle }}
          PRERELEASE: ${{ steps.release_channel.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          {
            cat dist/changelog-notes.md
            printf '\n---\n\n### Install\n\n'
            printf '%s\n' "1. Download \`Fastab-arm64.dmg\`, open it, and drag **FasTab** to Applications."
            if [ "$SIGNING" = "true" ]; then
              cat <<'EOF'
          2. Launch **FasTab**, open FasTab Settings, and click **Grant
             Accessibility**. Follow the drag guide in System Settings -> Privacy &
             Security -> Device Control and Data Access (named Accessibility on macOS 26
             and earlier). The input method is optional and can be installed in Settings.
          3. Reload your shell: `exec $SHELL`
          EOF
            else
              cat <<'EOF'
          2. This build is ad-hoc signed, so macOS Gatekeeper will quarantine it. After
             copying to Applications, clear the quarantine flag once:

             ```bash
             xattr -dr com.apple.quarantine "/Applications/Fastab.app"
             ```

          3. Launch **FasTab**, open FasTab Settings, and click **Grant
             Accessibility**. Follow the drag guide in System Settings -> Privacy &
             Security -> Device Control and Data Access (named Accessibility on macOS 26
             and earlier). The input method is optional and can be installed in Settings.
          4. Reload your shell: `exec $SHELL`
          EOF
            fi
            printf '\n'
            if [ "$SIGNING" = "true" ] && [ "$NOTARIZE" = "true" ]; then
              printf '%s' "This DMG is Developer ID signed and notarized."
            elif [ "$SIGNING" = "true" ]; then
              printf '%s' "This DMG is Developer ID signed, but notarization secrets were not configured."
            else
              printf '%s' "This DMG is ad-hoc signed and is not notarized. Gatekeeper will block it until the quarantine flag is cleared."
            fi
            if [ "$SPARKLE" = "true" ]; then
              if [ "$PRERELEASE" = "true" ]; then
                printf '%s\n' " A signed Sparkle appcast is attached to this tag, but beta builds do not have an automatic beta update feed; download the next beta from its release page."
              else
                printf '%s\n' " A Sparkle appcast is attached for future stable updates."
              fi
            else
              printf '\n'
            fi
          } > dist/release-notes.md

      - name: Stage release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          APP_VERSION="${GITHUB_REF_NAME#v}"
          rm -rf dist/upload
          mkdir -p dist/upload
          cp dist/Fastab-arm64.dmg dist/upload/
          cp "dist/Fastab-${APP_VERSION}-arm64.dmg" dist/upload/
          if [ -f dist/sparkle/appcast.xml ]; then
            cp dist/sparkle/appcast.xml dist/upload/
          fi
          if compgen -G "dist/sparkle/*.delta" > /dev/null; then
            cp dist/sparkle/*.delta dist/upload/
          fi

      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: Fastab-arm64
          path: dist/upload/*
          if-no-files-found: error

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/upload/*
          fail_on_unmatched_files: true
          prerelease: ${{ steps.release_channel.outputs.is_prerelease == 'true' }}
          body_path: dist/release-notes.md

      - name: Send Telegram notification
        if: always() && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRODUCT_NAME: FasTab
          BUILD_RESULT: ${{ job.status }}
          GH_ACTOR: ${{ github.actor }}
          GH_REF: ${{ github.ref_name }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STARTED_AT: ${{ steps.start.outputs.started_at }}
        run: |
          ELAPSED=$(( $(date +%s) - STARTED_AT ))
          DURATION="$(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s"

          case "$BUILD_RESULT" in
            success)   OVERALL="✅ ${PRODUCT_NAME} 构建成功" ;;
            failure)   OVERALL="❌ ${PRODUCT_NAME} 构建失败" ;;
            cancelled) OVERALL="⚠️ ${PRODUCT_NAME} 取消" ;;
            *)         OVERALL="❓ ${PRODUCT_NAME} 未知" ;;
          esac

          RAW_MSG=$(git log -1 --pretty=format:"%s" HEAD)
          if [ ${#RAW_MSG} -gt 80 ]; then
            COMMIT_MSG="${RAW_MSG:0:80}..."
          else
            COMMIT_MSG="$RAW_MSG"
          fi

          MESSAGE=$(cat <<EOF
          ${OVERALL}

          🏷️ 版本：\`${GH_REF}\`
          👤 触发者：${GH_ACTOR}
          📝 提交：\`${GITHUB_SHA:0:7}\` ${COMMIT_MSG}
          ⏰ 时间：$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S CST')
          ⏱️ 耗时：${DURATION}

          🔗 查看详情：${GH_RUN_URL}
          EOF
          )

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":$(echo "$MESSAGE" | jq -Rs .),\"disable_web_page_preview\":true}"
